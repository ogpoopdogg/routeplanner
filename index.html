            // Listen for working route
            db.ref(`developer/route_planner/working/${currentRouteKey}`).on('value', snap => {
                const data = snap.val() || {};
                routeData.stops = data.stops || {};
                routeData.order = data.order || [];
                routeData.assignedIndices = data.assignedIndices || {};
                routeData.isFinalized = data.isFinalized || false;
                routeData.etaTotalMinutes = data.etaTotalMinutes || 0;
                routeData.etaTotalKm = data.etaTotalKm || 0;
                routeData.forwardSegments = data.forwardSegments || [];
                routeData.returnPath = data.returnPath || null;
                // Update local variables for polyline drawing
                forwardSegments = routeData.forwardSegments.map(seg => seg.map(p => new google.maps.LatLng(p.lat, p.lng)));
                returnPath = routeData.returnPath ? routeData.returnPath.map(p => new google.maps.LatLng(p.lat, p.lng)) : null;
                etaTotalMinutes = routeData.etaTotalMinutes;
                etaTotalKm = routeData.etaTotalKm;
                // Ensure all stops have lat/lng (geocode missing)
                ensureAllJobsGeocoded().then(() => {
                    updateUI();
                    redrawRouteFromCurrentState();
                });
            });

            initPlaces();
            createRouteMapBtn = document.getElementById('create-route-map');
            updateCreateRouteButton();
        }

        // ---------- GEOCODING ----------
        function geocodeJob(jobId) {
            const job = routeData.stops[jobId];
            if (!job) return Promise.reject("Job not found");
            if (job.lat && job.lng) return Promise.resolve({ lat: job.lat, lng: job.lng });
            const address = job.pickup_location + ', ' + job.city;
            const geocoder = new google.maps.Geocoder();
            return new Promise((resolve, reject) => {
                geocoder.geocode({ address: address, region: 'ca' }, (results, status) => {
                    if (status === 'OK' && results.length > 0) {
                        const loc = results[0].geometry.location;
                        const lat = loc.lat();
                        const lng = loc.lng();
                        db.ref(`developer/route_planner/working/${currentRouteKey}/stops/${jobId}/lat`).set(lat);
                        db.ref(`developer/route_planner/working/${currentRouteKey}/stops/${jobId}/lng`).set(lng);
                        job.lat = lat;
                        job.lng = lng;
                        resolve({ lat, lng });
                    } else {
                        reject("Geocode failed for " + address);
                    }
                });
            });
        }

        function ensureAllJobsGeocoded() {
            const pendingIds = Object.keys(routeData.stops).filter(id => routeData.stops[id].status === 'pending_pickup');
            const needsGeocode = pendingIds.filter(id => !routeData.stops[id].lat || !routeData.stops[id].lng);
            if (needsGeocode.length === 0) return Promise.resolve();
            const promises = needsGeocode.map(id => geocodeJob(id).catch(err => console.warn(err)));
            return Promise.all(promises);
        }

        // ---------- SAVE ROUTE STATE ----------
        function saveWorkingRoute() {
            if (!currentUser) return;
            const dataToSave = {
                stops: routeData.stops,
                order: routeData.order,
                assignedIndices: routeData.assignedIndices,
                isFinalized: routeData.isFinalized,
                etaTotalMinutes: routeData.etaTotalMinutes,
                etaTotalKm: routeData.etaTotalKm,
                forwardSegments: routeData.forwardSegments,
                returnPath: routeData.returnPath
            };
            db.ref(`developer/route_planner/working/${currentRouteKey}`).set(dataToSave).catch(err => console.warn("Save working route error:", err));
        }

        // ---------- REDRAW ROUTE FROM CURRENT STATE ----------
        function redrawRouteFromCurrentState() {
            if (!map) return;
            clearRoutePolylines();
            if (routeData.isFinalized && routeData.order.length > 0) {
                // Draw forward and return
                updatePolyline();
            } else if (isOrderingMode && routeData.order.length > 0) {
                // Draw forward only
                updatePolyline();
            } else {
                // Nothing
                updatePolyline();
            }
        }

        // ---------- POLYLINE DRAWING ----------
        function clearRoutePolylines() {
            forwardPolylines.forEach(p => p.setMap(null));
            forwardPolylines = [];
            if (returnPolyline) {
                returnPolyline.setMap(null);
                returnPolyline = null;
            }
            arrowMarkers.forEach(m => m.setMap(null));
            arrowMarkers = [];
        }

        function computePathPointAtFraction(path, fraction) {
            const totalDist = google.maps.geometry.spherical.computeLength(path);
            const targetDist = totalDist * fraction;
            let accumulated = 0;
            for (let i = 0; i < path.length - 1; i++) {
                const segDist = google.maps.geometry.spherical.computeDistanceBetween(path[i], path[i + 1]);
                if (accumulated + segDist >= targetDist) {
                    const segFrac = segDist === 0 ? 0 : (targetDist - accumulated) / segDist;
                    const point = google.maps.geometry.spherical.interpolate(path[i], path[i + 1], segFrac);
                    const heading = google.maps.geometry.spherical.computeHeading(path[i], path[i + 1]);
                    return { point, heading };
                }
                accumulated += segDist;
            }
            const last = path.length - 1;
            const heading = google.maps.geometry.spherical.computeHeading(path[last - 1], path[last]);
            return { point: path[last], heading };
        }

        function updatePolyline() {
            if (!map) return;
            clearRoutePolylines();

            // Draw forward segments
            forwardSegments.forEach(seg => {
                if (seg.length < 2) return;
                const polyline = new google.maps.Polyline({
                    path: seg,
                    geodesic: true,
                    strokeColor: "#00d4ff",
                    strokeOpacity: 0.8,
                    strokeWeight: 6,
                    map: map,
                    zIndex: 1
                });
                forwardPolylines.push(polyline);

                const arrowColor = "#00d4ff";
                const arrowSymbol = {
                    path: google.maps.SymbolPath.FORWARD_CLOSED_ARROW,
                    fillColor: arrowColor,
                    fillOpacity: 1,
                    strokeColor: '#000000',
                    strokeWeight: 1,
                    scale: 4
                };
                const totalDist = google.maps.geometry.spherical.computeLength(seg);
                if (totalDist >= 10) {
                    const fractions = [1/3, 2/3];
                    fractions.forEach(frac => {
                        const { point, heading } = computePathPointAtFraction(seg, frac);
                        const arrowMarker = new google.maps.Marker({
                            position: point,
                            map: map,
                            icon: { ...arrowSymbol, rotation: heading },
                            clickable: false,
                            zIndex: 2
                        });
                        arrowMarkers.push(arrowMarker);
                    });
                }
            });

            // Draw return if exists
            if (returnPath && returnPath.length > 1) {
                returnPolyline = new google.maps.Polyline({
                    path: returnPath,
                    geodesic: true,
                    strokeColor: "#ff3333",
                    strokeOpacity: 1.0,
                    strokeWeight: 6,
                    map: map,
                    zIndex: 3
                });
                const redArrowSymbol = {
                    path: google.maps.SymbolPath.FORWARD_CLOSED_ARROW,
                    fillColor: "#ff3333",
                    fillOpacity: 1,
                    strokeColor: '#000000',
                    strokeWeight: 1,
                    scale: 4
                };
                const totalDist = google.maps.geometry.spherical.computeLength(returnPath);
                if (totalDist >= 10) {
                    const fractions = [1/3, 2/3];
                    fractions.forEach(frac => {
                        const { point, heading } = computePathPointAtFraction(returnPath, frac);
                        const arrowMarker = new google.maps.Marker({
                            position: point,
                            map: map,
                            icon: { ...redArrowSymbol, rotation: heading },
                            clickable: false,
                            zIndex: 4
                        });
                        arrowMarkers.push(arrowMarker);
                    });
                }
            }
        }

        // ---------- FETCH DRIVING PATH ----------
        async function getDrivingPath(originLatLng, destLatLng) {
            const cacheKey = originLatLng.lat.toFixed(6) + ',' + originLatLng.lng.toFixed(6) + '_' + destLatLng.lat.toFixed(6) + ',' + destLatLng.lng.toFixed(6);
            if (segmentCache[cacheKey]) {
                return segmentCache[cacheKey];
            }
            try {
                const response = await fetch("https://routes.googleapis.com/directions/v2:computeRoutes", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "X-Goog-Api-Key": "AIzaSyA6umETP8wBUEV41ugAtiNiChUeLmmwmZI",
                        "X-Goog-FieldMask": "routes.polyline.encodedPolyline"
                    },
                    body: JSON.stringify({
                        origin: { location: { latLng: { latitude: originLatLng.lat, longitude: originLatLng.lng } } },
                        destination: { location: { latLng: { latitude: destLatLng.lat, longitude: destLatLng.lng } } },
                        travelMode: "DRIVE"
                    })
                });
                if (!response.ok) {
                    throw new Error("HTTP " + response.status);
                }
                const data = await response.json();
                if (data.routes && data.routes[0] && data.routes[0].polyline) {
                    const encoded = data.routes[0].polyline.encodedPolyline;
                    const decoded = google.maps.geometry.encoding.decodePath(encoded);
                    segmentCache[cacheKey] = decoded;
                    return decoded;
                } else {
                    throw new Error("No route found");
                }
            } catch (err) {
                console.warn("Routes API failed, falling back to straight line:", err);
                return [originLatLng, destLatLng];
            }
        }

        // ---------- ADD SEGMENT ----------
        async function addSegmentToRoute(jobId) {
            const order = routeData.order;
            if (order.length === 0) return;
            const job = routeData.stops[jobId];
            if (!job || !job.lat || !job.lng) return;

            const depot = { lat: 49.881157, lng: -99.959272 };
            let prevLatLng;
            if (order.length === 1) {
                prevLatLng = depot;
            } else {
                const prevId = order[order.length - 2];
                const prevJob = routeData.stops[prevId];
                if (!prevJob || !prevJob.lat || !prevJob.lng) {
                    prevLatLng = depot;
                } else {
                    prevLatLng = { lat: prevJob.lat, lng: prevJob.lng };
                }
            }
            const destLatLng = { lat: job.lat, lng: job.lng };
            try {
                const path = await getDrivingPath(prevLatLng, destLatLng);
                routeData.forwardSegments.push(path.map(p => ({ lat: p.lat(), lng: p.lng() })));
                forwardSegments.push(path);
            } catch (err) {
                console.warn("Failed to get path for new segment, using straight line:", err);
                routeData.forwardSegments.push([{ lat: prevLatLng.lat, lng: prevLatLng.lng }, { lat: destLatLng.lat, lng: destLatLng.lng }]);
                forwardSegments.push([prevLatLng, destLatLng]);
            }
        }

        // ---------- FETCH RETURN ----------
        async function fetchReturnRoute() {
            const order = routeData.order;
            if (order.length === 0) {
                returnPath = null;
                routeData.returnPath = null;
                updatePolyline();
                return;
            }
            const lastId = order[order.length - 1];
            const lastJob = routeData.stops[lastId];
            if (!lastJob || !lastJob.lat || !lastJob.lng) {
                returnPath = null;
                routeData.returnPath = null;
                updatePolyline();
                return;
            }
            const depot = { lat: 49.881157, lng: -99.959272 };
            const lastLatLng = { lat: lastJob.lat, lng: lastJob.lng };
            try {
                const path = await getDrivingPath(lastLatLng, depot);
                returnPath = path;
                routeData.returnPath = path.map(p => ({ lat: p.lat(), lng: p.lng() }));
            } catch (err) {
                console.warn("Failed to get return path", err);
                returnPath = [lastLatLng, depot];
                routeData.returnPath = [{ lat: lastLatLng.lat, lng: lastLatLng.lng }, { lat: depot.lat, lng: depot.lng }];
            }
            updatePolyline();
        }

        // ---------- UI UPDATE ----------
        function updateUI() {
            renderList();
            if (map) updateMapMarkers();
            updateCreateRouteButton();
            updateOrderingOverlays();
            if (etaTotalMinutes > 0 && routeData.isFinalized) {
                document.getElementById('eta-display').style.display = 'block';
                document.getElementById('eta-display').classList.add('eta-glow');
                updateETADisplay();
            } else {
                document.getElementById('eta-display').style.display = 'none';
                document.getElementById('eta-display').classList.remove('eta-glow');
            }
            const totalStops = Object.keys(routeData.stops).filter(id => routeData.stops[id].status === 'pending_pickup').length;
            const counter = document.getElementById('stop-counter');
            if (totalStops > 0) {
                counter.textContent = totalStops;
                counter.style.display = 'inline-block';
            } else {
                counter.style.display = 'none';
            }
        }

        // ---------- RENDER LIST ----------
        function renderList() {
            const container = document.getElementById('job-list');
            const emptyState = document.getElementById('empty-state');
            const pendingIds = Object.keys(routeData.stops).filter(id => routeData.stops[id].status === 'pending_pickup');
            if (pendingIds.length === 0) {
                container.innerHTML = '';
                emptyState.style.display = 'block';
                return;
            }
            emptyState.style.display = 'none';

            let displayOrder = [];
            if (routeData.isFinalized && routeData.order.length > 0) {
                displayOrder = routeData.order.filter(id => routeData.stops[id] && routeData.stops[id].status === 'pending_pickup');
                const extra = pendingIds.filter(id => !displayOrder.includes(id));
                displayOrder = displayOrder.concat(extra);
            } else if (routeData.order.length > 0) {
                displayOrder = routeData.order.filter(id => routeData.stops[id] && routeData.stops[id].status === 'pending_pickup');
                const extra = pendingIds.filter(id => !displayOrder.includes(id));
                displayOrder = displayOrder.concat(extra);
            } else {
                displayOrder = pendingIds.sort((a,b) => routeData.stops[a].timestamp - routeData.stops[b].timestamp);
            }

            let html = '';
            displayOrder.forEach(id => {
                const job = routeData.stops[id];
                if (!job) return;
                const number = routeData.assignedIndices[id] || null;
                const isPending = number === null;
                const pendingClass = isPending ? 'pending' : '';
                const numberDisplay = number !== null ? number : '';
                html += `
                    <div class="job-item ${pendingClass}" data-id="${id}" onclick="openDetailsModal('${id}')">
                        <span class="job-number">${numberDisplay}</span>
                        <div class="job-info">
                            <div class="job-name">${job.name || 'No name'}</div>
                            <div class="job-address">${job.pickup_location || ''}, ${job.city || ''}</div>
                        </div>
                        <svg class="delete-icon" viewBox="0 0 24 24" onclick="deleteJob('${id}'); event.stopPropagation();">
                            <path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/>
                        </svg>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        // ---------- MAP MARKERS ----------
        function updateMapMarkers() {
            if (!map) return;
            Object.values(mapMarkers).forEach(m => m.setMap(null));
            mapMarkers = {};
            stopPulsingAll();

            const pendingIds = Object.keys(routeData.stops).filter(id => routeData.stops[id].status === 'pending_pickup');
            if (pendingIds.length === 0) return;

            const isFinal = routeData.isFinalized;
            const isOrdering = isOrderingMode;

            pendingIds.forEach(id => {
                const job = routeData.stops[id];
                if (!job.lat || !job.lng) return;
                const number = routeData.assignedIndices[id] || null;
                const isAssigned = number !== null;
                let labelText = isAssigned ? `${number}. ${job.name || ''}` : job.name || '';

                let marker;
                if (isFinal) {
                    const labelOptions = {
                        text: labelText,
                        color: isAssigned ? '#00b32d' : '#FFD700',
                        fontWeight: 'bold',
                        fontSize: isAssigned ? '12px' : '16px',
                        className: isAssigned ? 'driver-map-label' : 'driver-map-label-pending'
                    };
                    const iconColor = isAssigned ? '#10B981' : '#F59E0B';
                    marker = new google.maps.Marker({
                        position: { lat: job.lat, lng: job.lng },
                        map: map,
                        label: labelOptions,
                        icon: {
                            path: google.maps.SymbolPath.CIRCLE,
                            scale: 14,
                            fillColor: iconColor,
                            fillOpacity: 1,
                            strokeColor: 'white',
                            strokeWeight: 2
                        }
                    });
                } else if (isOrdering) {
                    if (isAssigned) {
                        marker = new google.maps.Marker({
                            position: { lat: job.lat, lng: job.lng },
                            map: map,
                            label: {
                                text: labelText,
                                color: '#10B981',
                                fontWeight: 'bold',
                                fontSize: '12px',
                                className: 'driver-map-label'
                            },
                            icon: {
                                path: google.maps.SymbolPath.CIRCLE,
                                scale: 10,
                                fillColor: '#10B981',
                                fillOpacity: 1,
                                strokeColor: 'white',
                                strokeWeight: 2
                            }
                        });
                    } else {
                        // Unassigned: pulsing
                        marker = new google.maps.Marker({
                            position: { lat: job.lat, lng: job.lng },
                            map: map,
                            label: {
                                text: labelText,
                                color: '#F59E0B',
                                fontWeight: 'bold',
                                fontSize: '18px',
                                className: 'driver-map-label-pending'
                            },
                            icon: {
                                path: google.maps.SymbolPath.CIRCLE,
                                scale: 10,
                                fillColor: '#F59E0B',
                                fillOpacity: 1,
                                strokeColor: 'white',
                                strokeWeight: 2
                            }
                        });
                        const circle = new google.maps.Circle({
                            map: map,
                            center: { lat: job.lat, lng: job.lng },
                            radius: 10,
                            fillColor: '#F59E0B',
                            fillOpacity: 0.4,
                            strokeColor: '#F59E0B',
                            strokeWeight: 2,
                            strokeOpacity: 0.7
                        });
                        let growing = true;
                        let markerScale = 10;
                        const interval = setInterval(() => {
                            let rad = circle.getRadius();
                            if (growing) { rad += 2; if (rad > 24) growing = false; }
                            else { rad -= 2; if (rad < 8) growing = true; }
                            circle.setRadius(rad);
                            let op = circle.getFillOpacity();
                            if (growing) op = Math.min(op + 0.05, 0.8);
                            else op = Math.max(op - 0.05, 0.2);
                            circle.setFillOpacity(op);
                            circle.setStrokeOpacity(op);
                            markerScale = growing ? Math.min(markerScale + 0.4, 13) : Math.max(markerScale - 0.4, 10);
                            marker.setIcon({
                                path: google.maps.SymbolPath.CIRCLE,
                                scale: markerScale,
                                fillColor: '#F59E0B',
                                fillOpacity: 1,
                                strokeColor: 'white',
                                strokeWeight: 2
                            });
                        }, 60);
                        pulsingMarkers[id] = { marker, circle, interval };
                        marker.addListener('click', () => handleUnassignedMarkerClick(id));
                    }
                } else {
                    // Not ordering, not finalized: orange
                    marker = new google.maps.Marker({
                        position: { lat: job.lat, lng: job.lng },
                        map: map,
                        label: {
                            text: labelText,
                            color: '#00b32d',
                            fontWeight: 'bold',
                            fontSize: '12px',
                            className: 'driver-map-label'
                        },
                        icon: {
                            path: google.maps.SymbolPath.CIRCLE,
                            scale: 14,
                            fillColor: '#ff9800',
                            fillOpacity: 1,
                            strokeColor: 'white',
                            strokeWeight: 2
                        }
                    });
                }
                mapMarkers[id] = marker;
            });
        }

        function stopPulsingAll() {
            Object.values(pulsingMarkers).forEach(p => {
                if (p.interval) clearInterval(p.interval);
                if (p.circle) p.circle.setMap(null);
                if (p.marker) {
                    p.marker.setIcon({
                        path: google.maps.SymbolPath.CIRCLE,
                        scale: 14,
                        fillColor: '#ff9800',
                        fillOpacity: 1,
                        strokeColor: 'white',
                        strokeWeight: 2
                    });
                    const jobId = Object.keys(pulsingMarkers).find(k => pulsingMarkers[k] === p);
                    if (jobId && routeData.stops[jobId]) {
                        p.marker.setLabel({
                            text: routeData.stops[jobId].name || '',
                            color: '#00b32d',
                            fontWeight: 'bold',
                            fontSize: '12px',
                            className: 'driver-map-label'
                        });
                    }
                }
            });
            pulsingMarkers = {};
        }

        // ---------- ORDERING MODE ----------
        function startCreateRoute() {
            const pendingIds = Object.keys(routeData.stops).filter(id => routeData.stops[id].status === 'pending_pickup');
            if (pendingIds.length === 0) {
                alert("No stops to route.");
                return;
            }

            ensureAllJobsGeocoded().then(() => {
                if (routeData.isFinalized || routeData.order.length > 0) {
                    if (!confirm("Erase current order and recreate?")) return;
                    // Reset ordering
                    routeData.order = [];
                    routeData.assignedIndices = {};
                    routeData.isFinalized = false;
                    routeData.forwardSegments = [];
                    routeData.returnPath = null;
                    forwardSegments = [];
                    returnPath = null;
                    clearRoutePolylines();
                    saveWorkingRoute();
                    updateUI();
                }

                // Enter ordering mode
                isOrderingMode = true;
                openMap(true);
                zoomToAllWaypoints();
                updateUI();
                updateCreateRouteButton();
                updateOrderingOverlays();
            });
        }

        function zoomToAllWaypoints() {
            const bounds = new google.maps.LatLngBounds();
            bounds.extend({ lat: 49.881157, lng: -99.959272 });
            let hasJob = false;
            const pendingIds = Object.keys(routeData.stops).filter(id => routeData.stops[id].status === 'pending_pickup');
            pendingIds.forEach(id => {
                const job = routeData.stops[id];
                if (job.lat && job.lng) {
                    bounds.extend({ lat: job.lat, lng: job.lng });
                    hasJob = true;
                }
            });
            if (map) {
                if (hasJob) {
                    map.fitBounds(bounds);
                } else {
                    map.setCenter({ lat: 49.881157, lng: -99.959272 });
                    map.setZoom(12);
                }
            }
        }

        function handleUnassignedMarkerClick(jobId) {
            if (!map) { assignNumber(jobId); return; }
            const otherPendingIds = Object.keys(routeData.stops).filter(id =>
                routeData.stops[id].status === 'pending_pickup' && !routeData.assignedIndices[id] && routeData.stops[id].lat && routeData.stops[id].lng && id !== jobId
            );
            const job = routeData.stops[jobId];
            if (!job || !job.lat || !job.lng) return;
            const tapPoint = new google.maps.LatLng(job.lat, job.lng);
            const hasNearbyCluster = otherPendingIds.some(id => {
                const other = routeData.stops[id];
                if (!other.lat || !other.lng) return false;
                const otherPoint = new google.maps.LatLng(other.lat, other.lng);
                return google.maps.geometry.spherical.computeDistanceBetween(tapPoint, otherPoint) < 30;
            });
            const MAX_ZOOM = 20;
            if (hasNearbyCluster && map.getZoom() < MAX_ZOOM) {
                map.panTo(tapPoint);
                map.setZoom(Math.min(map.getZoom() + 2, MAX_ZOOM));
                return;
            }
            assignNumber(jobId);
        }

        function assignNumber(jobId) {
            if (!isOrderingMode) return;
            if (routeData.assignedIndices[jobId]) return;
            if (!routeData.stops[jobId] || routeData.stops[jobId].status !== 'pending_pickup') return;

            if (!routeData.stops[jobId].lat || !routeData.stops[jobId].lng) {
                geocodeJob(jobId).then(() => {
                    assignNumber(jobId);
                }).catch(err => console.warn("Geocode failed, cannot assign:", err));
                return;
            }

            const assignedIds = Object.keys(routeData.assignedIndices);
            const nextNumber = assignedIds.length + 1;
            routeData.assignedIndices[jobId] = nextNumber;
            routeData.order.push(jobId);

            // Remove pulsing
            if (pulsingMarkers[jobId]) {
                clearInterval(pulsingMarkers[jobId].interval);
                if (pulsingMarkers[jobId].circle) pulsingMarkers[jobId].circle.setMap(null);
                const marker = pulsingMarkers[jobId].marker;
                const job = routeData.stops[jobId];
                marker.setLabel({
                    text: `${nextNumber}. ${job.name || ''}`,
                    color: '#10B981',
                    fontWeight: 'bold',
                    fontSize: '12px',
                    className: 'driver-map-label'
                });
                marker.setIcon({
                    path: google.maps.SymbolPath.CIRCLE,
                    scale: 10,
                    fillColor: '#10B981',
                    fillOpacity: 1,
                    strokeColor: 'white',
                    strokeWeight: 2
                });
                delete pulsingMarkers[jobId];
            }

            updateOrderingOverlays();

            const indicator = document.getElementById('calculating-route-indicator');
            if (indicator) indicator.style.display = 'block';
            clearTimeout(polylineDebounceTimer);
            polylineDebounceTimer = setTimeout(() => {
                addSegmentToRoute(jobId).then(() => {
                    if (indicator) indicator.style.display = 'none';
                    saveWorkingRoute();
                    renderList();
                    updatePolyline();

                    // Check if all assigned
                    const pendingIds = Object.keys(routeData.stops).filter(id => routeData.stops[id].status === 'pending_pickup');
                    const assignedIdsNow = Object.keys(routeData.assignedIndices);
                    if (pendingIds.length === assignedIdsNow.length && pendingIds.length > 0) {
                        finalizeRoute();
                    } else {
                        panToClosestUnassigned(jobId);
                    }
                }).catch(err => {
                    if (indicator) indicator.style.display = 'none';
                    console.warn("Error adding segment:", err);
                });
            }, 250);
        }

        function panToClosestUnassigned(fromJobId) {
            const fromJob = routeData.stops[fromJobId];
            if (!fromJob || !map) return;
            const candidateIds = Object.keys(routeData.stops).filter(id =>
                routeData.stops[id].status === 'pending_pickup' && !routeData.assignedIndices[id] && routeData.stops[id].lat && routeData.stops[id].lng
            );
            if (candidateIds.length === 0) return;
            let closestId = null, closestDistSq = Infinity;
            candidateIds.forEach(id => {
                const j = routeData.stops[id];
                const dLat = j.lat - fromJob.lat;
                const dLng = j.lng - fromJob.lng;
                const distSq = dLat * dLat + dLng * dLng;
                if (distSq < closestDistSq) { closestDistSq = distSq; closestId = id; }
            });
            if (closestId) {
                map.panTo({ lat: routeData.stops[closestId].lat, lng: routeData.stops[closestId].lng });
            }
        }

        function undoLastAssignment() {
            if (!isOrderingMode || routeData.order.length === 0) return;
            const lastId = routeData.order.pop();
            delete routeData.assignedIndices[lastId];
            if (routeData.forwardSegments.length > 0) {
                routeData.forwardSegments.pop();
                forwardSegments.pop();
            }
            routeData.isFinalized = false;
            saveWorkingRoute();
            updateUI();
            updatePolyline();
            updateOrderingOverlays();
            zoomToAllWaypoints();
        }

        function finishRouteEarly() {
            if (!isOrderingMode || routeData.order.length === 0) return;
            finalizeRoute();
        }

        function finalizeRoute() {
            routeData.isFinalized = true;
            isOrderingMode = false;
            stopPulsingAll();
            updateOrderingOverlays();
            fetchReturnRoute().then(() => {
                saveWorkingRoute();
                updateUI();
                if (createRouteMapBtn) createRouteMapBtn.classList.remove('active');
                if (etaTotalMinutes > 0) updateETADisplay();
                // Do not auto-fit map
            });
        }

        function updateOrderingOverlays() {
            const counterEl = document.getElementById('map-stop-counter');
            const undoBtn = document.getElementById('undo-assignment-btn');
            const finishBtn = document.getElementById('finish-early-btn');
            const totalStops = Object.keys(routeData.stops).filter(id => routeData.stops[id].status === 'pending_pickup').length;
            const assignedCount = Object.keys(routeData.assignedIndices).length;
            if (isOrderingMode && !routeData.isFinalized) {
                if (counterEl) {
                    counterEl.textContent = `${assignedCount} / ${totalStops} assigned`;
                    counterEl.style.display = 'block';
                }
                if (undoBtn) undoBtn.style.display = assignedCount > 0 ? 'flex' : 'none';
                if (finishBtn) finishBtn.style.display = assignedCount > 0 ? 'block' : 'none';
            } else {
                if (counterEl) counterEl.style.display = 'none';
                if (undoBtn) undoBtn.style.display = 'none';
                if (finishBtn) finishBtn.style.display = 'none';
            }
        }

        // ---------- UPDATE CREATE ROUTE BUTTON ----------
        function updateCreateRouteButton() {
            const pending = Object.keys(routeData.stops).filter(id => routeData.stops[id].status === 'pending_pickup');
            const hasStops = pending.length > 0;
            const isFinal = routeData.isFinalized;
            const isOrdering = isOrderingMode;

            if (createRouteMapBtn) {
                if (!hasStops) {
                    createRouteMapBtn.disabled = true;
                    createRouteMapBtn.classList.remove('pulse-glow', 'active');
                } else {
                    createRouteMapBtn.disabled = false;
                    if (isOrdering) {
                        createRouteMapBtn.classList.add('active', 'pulse-glow');
                    } else {
                        createRouteMapBtn.classList.remove('pulse-glow', 'active');
                    }
                }
            }
        }

        // ---------- DETAILS MODAL ----------
        function openDetailsModal(jobId) {
            const job = routeData.stops[jobId];
            if (!job) return;
            currentDetailsJobId = jobId;
            document.getElementById('details-stop-title').textContent = job.name || 'Stop';
            document.getElementById('box-display').textContent = job.box_qty || 0;
            document.getElementById('piece-display').textContent = job.piece_qty || 0;
            document.getElementById('envelope-display').textContent = job.envelope_qty || 0;
            document.getElementById('skid-display').textContent = job.skid_qty || 0;
            document.getElementById('weight-input').value = job.weight_lbs || '';
            document.getElementById('other-input').value = job.other_details || '';
            detailsData = {
                box_qty: job.box_qty || 0,
                piece_qty: job.piece_qty || 0,
                envelope_qty: job.envelope_qty || 0,
                skid_qty: job.skid_qty || 0,
                weight_lbs: job.weight_lbs || 0,
                other_details: job.other_details || ''
            };
            document.getElementById('details-modal').style.display = 'flex';
            document.querySelector('.details-modal-content').scrollTop = 0;
        }

        function closeDetailsModal() {
            document.getElementById('details-modal').style.display = 'none';
            currentDetailsJobId = null;
            detailsData = {};
        }

        function updateQuantity(category, delta) {
            const displayId = category + '-display';
            const display = document.getElementById(displayId);
            if (!display) return;
            let val = parseInt(display.textContent) || 0;
            val = Math.max(0, val + delta);
            display.textContent = val;
            const key = category + '_qty';
            detailsData[key] = val;
        }

        function saveDetailsFromModal() {
            if (!currentDetailsJobId) return;
            const weightVal = parseInt(document.getElementById('weight-input').value) || 0;
            const otherVal = document.getElementById('other-input').value;
            detailsData.weight_lbs = Math.min(9999, Math.max(0, weightVal));
            detailsData.other_details = otherVal;
            const updates = {};
            for (let key in detailsData) {
                updates[key] = detailsData[key];
            }
            db.ref(`developer/route_planner/working/${currentRouteKey}/stops/${currentDetailsJobId}`).update(updates)
                .then(() => {
                    closeDetailsModal();
                })
                .catch(err => alert("Error saving details: " + err.message));
        }

        // Attach event listeners for +/- buttons
        document.addEventListener('DOMContentLoaded', function() {
            document.querySelectorAll('.qty-plus').forEach(btn => {
                btn.addEventListener('click', function() {
                    const category = this.dataset.category;
                    updateQuantity(category, 1);
                });
            });
            document.querySelectorAll('.qty-minus').forEach(btn => {
                btn.addEventListener('click', function() {
                    const category = this.dataset.category;
                    updateQuantity(category, -1);
                });
            });
        });

        // ---------- ADD JOB ----------
        function addJob() {
            const name = document.getElementById('f-name').value.trim();
            const address = document.getElementById('f-address').value.trim();
            const city = document.getElementById('f-city').value.trim();
            if (!name || !address || !city) {
                alert("Please fill in all fields.");
                return;
            }
            const newJob = {
                name: name,
                pickup_location: address,
                city: city,
                status: 'pending_pickup',
                timestamp: Date.now(),
                created_by: currentUser,
                box_qty: 0,
                piece_qty: 0,
                envelope_qty: 0,
                skid_qty: 0,
                weight_lbs: 0,
                other_details: ''
            };
            const newJobRef = db.ref(`developer/route_planner/working/${currentRouteKey}/stops`).push();
            newJobRef.set(newJob).then(() => {
                const newId = newJobRef.key;
                routeData.stops[newId] = newJob;
                // If route was finalized, set isFinalized false
                if (routeData.isFinalized) {
                    routeData.isFinalized = false;
                    saveWorkingRoute();
                }
                // Update address lookup
                const sanitizedKey = name.replace(/[.#$\[\]\/]/g, "").trim();
                db.ref("address_lookup").child(sanitizedKey).update({
                    address: address,
                    city: city,
                    last_edit_by: currentUser
                });
                resetFormFields();
                // Geocode new job
                geocodeJob(newId).then(() => {
                    updateUI();
                }).catch(err => console.warn("Geocode failed:", err));
            }).catch(err => alert("Error adding job: " + err.message));
        }

        // ---------- DELETE JOB ----------
        function deleteJob(id) {
            if (confirm("Remove this stop from route?")) {
                db.ref(`developer/route_planner/working/${currentRouteKey}/stops/${id}`).remove();
                delete routeData.stops[id];
                // Remove from order and assignedIndices
                const idx = routeData.order.indexOf(id);
                if (idx !== -1) {
                    routeData.order.splice(idx, 1);
                    delete routeData.assignedIndices[id];
                    // Rebuild assignedIndices to renumber
                    const newAssigned = {};
                    routeData.order.forEach((id2, i) => { newAssigned[id2] = i + 1; });
                    routeData.assignedIndices = newAssigned;
                }
                if (routeData.order.length === 0) {
                    routeData.isFinalized = false;
                    routeData.forwardSegments = [];
                    routeData.returnPath = null;
                    forwardSegments = [];
                    returnPath = null;
                }
                saveWorkingRoute();
                updateUI();
                redrawRouteFromCurrentState();
            }
        }

        // ---------- CLEAR ALL ----------
        function clearAllJobs() {
            if (confirm("Clear all stops from the working route?")) {
                db.ref(`developer/route_planner/working/${currentRouteKey}/stops`).remove();
                routeData.stops = {};
                routeData.order = [];
                routeData.assignedIndices = {};
                routeData.isFinalized = false;
                routeData.forwardSegments = [];
                routeData.returnPath = null;
                routeData.etaTotalMinutes = 0;
                routeData.etaTotalKm = 0;
                forwardSegments = [];
                returnPath = null;
                etaTotalMinutes = 0;
                etaTotalKm = 0;
                clearRoutePolylines();
                saveWorkingRoute();
                updateUI();
                document.getElementById('eta-display').style.display = 'none';
                document.getElementById('eta-display').classList.remove('eta-glow');
            }
        }

        // ---------- SAVE ROUTE ----------
        function saveCurrentRoute() {
            if (Object.keys(routeData.stops).length === 0) {
                alert("No stops to save.");
                return;
            }
            // Copy working route to saved_routes
            const dataToSave = {
                stops: routeData.stops,
                order: routeData.order,
                assignedIndices: routeData.assignedIndices,
                isFinalized: routeData.isFinalized,
                etaTotalMinutes: routeData.etaTotalMinutes,
                etaTotalKm: routeData.etaTotalKm,
                forwardSegments: routeData.forwardSegments,
                returnPath: routeData.returnPath,
                label: currentUser,
                timestamp: Date.now()
            };
            db.ref(`developer/route_planner/saved_routes/${currentRouteKey}`).set(dataToSave)
                .then(() => {
                    alert("Route saved successfully.");
                })
                .catch(err => alert("Error saving route: " + err.message));
        }

        // ---------- DELETE ALL SAVED ROUTES ----------
        function deleteAllSavedRoutes() {
            if (!confirm("Delete all saved routes? This will not affect your current working route.")) return;
            db.ref('developer/route_planner/saved_routes').set(null)
                .catch(err => alert("Error deleting saved routes: " + err.message));
        }

        // ---------- RENDER SAVED PILLS ----------
        function renderSavedPills(data) {
            const container = document.getElementById('saved-routes-container');
            container.innerHTML = '';
            const keys = Object.keys(data);
            if (keys.length === 0) return;
            keys.forEach(key => {
                const route = data[key];
                const pill = document.createElement('div');
                pill.className = 'saved-route-pill';
                pill.textContent = key;
                pill.dataset.key = key;
                pill.addEventListener('click', function(e) {
                    if (this.classList.contains('loading')) return;
                    if (confirm(`Load route for "${key}"? This will replace your current working route.`)) {
                        loadSavedRoute(key);
                    }
                });
                // Long press to delete
                let timer = null;
                pill.addEventListener('mousedown', function(e) {
                    timer = setTimeout(() => {
                        if (confirm(`Delete saved route for "${key}"?`)) {
                            db.ref(`developer/route_planner/saved_routes/${key}`).remove()
                                .catch(err => alert("Error deleting route: " + err.message));
                        }
                    }, 500);
                });
                pill.addEventListener('mouseup', function(e) {
                    if (timer) { clearTimeout(timer); timer = null; }
                });
                pill.addEventListener('mouseleave', function(e) {
                    if (timer) { clearTimeout(timer); timer = null; }
                });
                pill.addEventListener('touchstart', function(e) {
                    timer = setTimeout(() => {
                        if (confirm(`Delete saved route for "${key}"?`)) {
                            db.ref(`developer/route_planner/saved_routes/${key}`).remove()
                                .catch(err => alert("Error deleting route: " + err.message));
                        }
                    }, 500);
                });
                pill.addEventListener('touchend', function(e) {
                    if (timer) { clearTimeout(timer); timer = null; }
                });
                pill.addEventListener('touchmove', function(e) {
                    if (timer) { clearTimeout(timer); timer = null; }
                });
                container.appendChild(pill);
            });
        }

        // ---------- LOAD SAVED ROUTE ----------
        function loadSavedRoute(key) {
            const ref = db.ref(`developer/route_planner/saved_routes/${key}`);
            ref.once('value').then(snap => {
                const data = snap.val();
                if (!data || !data.stops) {
                    alert("Route is empty.");
                    return;
                }
                // Overwrite working route
                db.ref(`developer/route_planner/working/${currentRouteKey}`).set(data)
                    .then(() => {
                        // The listener will update UI automatically
                        // Also ensure geocoding
                        ensureAllJobsGeocoded().then(() => {
                            updateUI();
                            redrawRouteFromCurrentState();
                        });
                    })
                    .catch(err => alert("Error loading route: " + err.message));
            }).catch(err => alert("Error loading saved route: " + err.message));
        }

        // ---------- ETA ----------
        async function calculateETAOnDemand() {
            let order = [];
            if (routeData.isFinalized && routeData.order.length > 0) {
                order = routeData.order;
            } else {
                order = Object.keys(routeData.stops).filter(id => routeData.stops[id].status === 'pending_pickup').sort((a,b) => routeData.stops[a].timestamp - routeData.stops[b].timestamp);
            }
            if (order.length === 0) { alert("No stops to calculate ETA."); return; }

            const etaBtn = document.getElementById('eta-btn');
            etaBtn.disabled = true;
            etaBtn.classList.add('eta-spin');
            etaCalculating = true;
            try {
                const origin = "1604 Moreland Ave, Brandon MB";
                const destination = "1604 Moreland Ave, Brandon MB";
                const waypoints = order.map(id => ({ address: `${routeData.stops[id].pickup_location}, ${routeData.stops[id].city}` }));
                const response = await fetch("https://routes.googleapis.com/directions/v2:computeRoutes", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "X-Goog-Api-Key": "AIzaSyA6umETP8wBUEV41ugAtiNiChUeLmmwmZI",
                        "X-Goog-FieldMask": "routes.duration,routes.distanceMeters,routes.legs.duration,routes.legs.distanceMeters"
                    },
                    body: JSON.stringify({
                        origin: { address: origin },
                        destination: { address: destination },
                        intermediates: waypoints,
                        travelMode: "DRIVE",
                        optimizeWaypointOrder: false
                    })
                });
                const data = await response.json();
                if (data.routes && data.routes[0]) {
                    const route = data.routes[0];
                    let totalDurationSeconds = 0, totalDistanceMeters = 0;
                    if (route.legs) {
                        route.legs.forEach(leg => {
                            totalDurationSeconds += parseFloat(leg.duration.replace('s', ''));
                            totalDistanceMeters += parseFloat(leg.distanceMeters);
                        });
                    } else {
                        totalDurationSeconds = parseFloat(route.duration.replace('s', ''));
                        totalDistanceMeters = parseFloat(route.distanceMeters);
                    }
                    etaTotalMinutes = totalDurationSeconds / 60;
                    etaTotalKm = totalDistanceMeters / 1000;
                    routeData.etaTotalMinutes = etaTotalMinutes;
                    routeData.etaTotalKm = etaTotalKm;
                    saveWorkingRoute();
                    updateETADisplay();
                    document.getElementById('eta-display').style.display = 'block';
                    document.getElementById('eta-display').classList.add('eta-glow');
                } else {
                    alert("Could not calculate ETA.");
                }
            } catch(e) { console.error(e); alert("Error calculating ETA."); }
            finally {
                etaCalculating = false;
                etaBtn.disabled = false;
                etaBtn.classList.remove('eta-spin');
            }
        }

        function updateETADisplay() {
            const etaTime = document.getElementById('eta-time');
            const etaAdjusted = document.getElementById('eta-adjusted');
            const etaAdjustedTime = document.getElementById('eta-adjusted-time');
            const etaDistance = document.getElementById('eta-distance');
            const totalMinutes = etaTotalMinutes;
            if (totalMinutes === 0) return;
            const hours = Math.floor(totalMinutes / 60);
            const mins = Math.round(totalMinutes % 60);
            let timeStr = '';
            if (hours > 0) timeStr += hours + 'h ';
            timeStr += mins + 'm';
            etaTime.textContent = timeStr;
            const stops = routeData.order.length || Object.keys(routeData.stops).filter(id => routeData.stops[id].status === 'pending_pickup').length;
            const adjustedMinutes = totalMinutes + 3 * stops;
            const adjHours = Math.floor(adjustedMinutes / 60);
            const adjMins = Math.round(adjustedMinutes % 60);
            let adjStr = '';
            if (adjHours > 0) adjStr += adjHours + 'h ';
            adjStr += adjMins + 'm';
            etaAdjustedTime.textContent = adjStr;
            etaAdjusted.style.display = 'inline';
            etaDistance.textContent = etaTotalKm.toFixed(1);
        }

        // ---------- EXTERNAL ROUTE ----------
        function openExternalRoute() {
            const order = routeData.order.length > 0 ? routeData.order : Object.keys(routeData.stops).filter(id => routeData.stops[id].status === 'pending_pickup');
            if (order.length === 0) {
                alert("No stops to route.");
                return;
            }
            if (!confirm("Note: This will route only the first 10 stops.\nProceed?")) return;
            const origin = "1604 Moreland Ave, Brandon MB";
            const destination = "1604 Moreland Ave, Brandon MB";
            const seenLocs = new Set();
            const maxStops = 10;
            let stopsAdded = 0;
            const waypoints = order.map(id => {
                if (stopsAdded >= maxStops) return "";
                const job = routeData.stops[id];
                if (!job) return "";
                const key = `${job.pickup_location}, ${job.city}`;
                if (seenLocs.has(key)) return "";
                seenLocs.add(key);
                stopsAdded++;
                return encodeURIComponent(key);
            }).filter(w => w !== "").join("|");
            const userAgent = navigator.userAgent || navigator.vendor || window.opera;
            if (/android/i.test(userAgent)) {
                window.location.href = `intent://www.google.com/maps/dir/?api=1&origin=${encodeURIComponent(origin)}&destination=${encodeURIComponent(destination)}&waypoints=${waypoints}&travelmode=driving#Intent;scheme=https;package=com.google.android.apps.maps;end`;
            } else if (/iPad|iPhone|iPod/.test(userAgent) && !window.MSStream) {
                window.location.href = `comgooglemaps://?saddr=${encodeURIComponent(origin)}&daddr=${encodeURIComponent(destination)}&waypoints=${waypoints}&directionsmode=driving`;
            } else {
                window.open(`https://www.google.com/maps/dir/?api=1&origin=${encodeURIComponent(origin)}&destination=${encodeURIComponent(destination)}&waypoints=${waypoints}&travelmode=driving`, '_blank');
            }
        }

        // ---------- MAP FUNCTIONS ----------
        function initMap() {
            if (!google.maps) return;
            map = new google.maps.Map(document.getElementById('map'), {
                center: { lat: 49.881157, lng: -99.959272 },
                zoom: 12,
                gestureHandling: 'greedy',
                styles: document.body.classList.contains('light-mode') ? [] : mapStyles
            });
            mainMap = map;

            originMarker = new google.maps.Marker({
                position: { lat: 49.881157, lng: -99.959272 },
                map: map,
                title: '1604 Moreland Ave (Origin)'
            });

            initAddressPickerMap();
            redrawRouteFromCurrentState();
            updateUI();
        }

        function openMap(zoomToAll) {
            document.getElementById('map-modal').style.display = 'block';
            setTimeout(() => {
                google.maps.event.trigger(map, 'resize');
                if (zoomToAll) {
                    zoomToAllWaypoints();
                } else {
                    map.setCenter({ lat: 49.881157, lng: -99.959272 });
                    map.setZoom(12);
                }
                updateUI();
            }, 100);
        }

        function closeMap() {
            document.getElementById('map-modal').style.display = 'none';
        }

        function zoomToAll() {
            const bounds = new google.maps.LatLngBounds();
            forwardSegments.forEach(seg => seg.forEach(p => bounds.extend(p)));
            if (returnPath) returnPath.forEach(p => bounds.extend(p));
            if (bounds.isEmpty()) {
                map.setCenter({ lat: 49.881157, lng: -99.959272 });
                map.setZoom(12);
            } else {
                map.fitBounds(bounds);
            }
        }

        function resetMapView() { zoomToAll(); }

        // ---------- ADDRESS PICKER ----------
        function initAddressPickerMap() {
            if (pickerInitialized) return;
            const container = document.getElementById('picker-map');
            if (!container || !google.maps) return;
            const defaultCenter = { lat: 49.881157, lng: -99.959272 };
            pickerMap = new google.maps.Map(container, {
                center: defaultCenter,
                zoom: 12,
                mapTypeId: 'roadmap',
                styles: mapStyles,
                gestureHandling: 'greedy'
            });
            pickerGeocoder = new google.maps.Geocoder();
            pickerMarker = new google.maps.Marker({
                position: defaultCenter,
                map: pickerMap,
                draggable: true,
                animation: google.maps.Animation.DROP,
                icon: {
                    path: google.maps.SymbolPath.CIRCLE,
                    scale: 8,
                    fillColor: '#ff9800',
                    fillOpacity: 1,
                    strokeColor: '#ffffff',
                    strokeWeight: 2
                }
            });
            pickerMarker.addListener('dragend', function() {
                const pos = pickerMarker.getPosition();
                updatePickerInfo(pos.lat(), pos.lng());
            });
            pickerMap.addListener('click', function(e) {
                const lat = e.latLng.lat();
                const lng = e.latLng.lng();
                pickerMarker.setPosition({ lat, lng });
                updatePickerInfo(lat, lng);
            });
            const searchInput = document.getElementById('picker-search');
            if (searchInput) {
                pickerAutocomplete = new google.maps.places.Autocomplete(searchInput, {
                    types: ['geocode'],
                    componentRestrictions: { country: 'ca' }
                });
                pickerAutocomplete.addListener('place_changed', function() {
                    const place = pickerAutocomplete.getPlace();
                    if (!place.geometry) return;
                    const location = place.geometry.location;
                    const lat = location.lat();
                    const lng = location.lng();
                    pickerMap.panTo({ lat, lng });
                    pickerMap.setZoom(14);
                    pickerMarker.setPosition({ lat, lng });
                    updatePickerInfo(lat, lng);
                });
            }
            updatePickerInfo(defaultCenter.lat, defaultCenter.lng);
            pickerInitialized = true;
        }

        function openAddressPicker() {
            document.getElementById('address-picker-modal').style.display = 'block';
            if (!pickerInitialized) initAddressPickerMap();
            setTimeout(() => {
                if (pickerMap) {
                    google.maps.event.trigger(pickerMap, 'resize');
                    const pos = pickerMarker.getPosition();
                    if (pos) pickerMap.setCenter(pos);
                }
            }, 100);
            document.getElementById('picker-search').value = '';
            if (pickerMarker) {
                const pos = pickerMarker.getPosition();
                if (pos) updatePickerInfo(pos.lat(), pos.lng());
            }
        }

        function closeAddressPicker() {
            document.getElementById('address-picker-modal').style.display = 'none';
        }

        function updatePickerInfo(lat, lng) {
            const latLng = { lat, lng };
            pickerGeocoder.geocode({ location: latLng }, function(results, status) {
                let address = '', plusCode = '';
                if (status === 'OK' && results.length > 0) {
                    address = results[0].formatted_address || '';
                    for (let result of results) {
                        if (result.plus_code) {
                            plusCode = result.plus_code.compound_code || result.plus_code.global_code || '';
                            break;
                        }
                    }
                } else {
                    address = `Lat: ${lat.toFixed(6)}, Lng: ${lng.toFixed(6)}`;
                }
                if (!plusCode) {
                    for (let result of results) {
                        if (result.address_components) {
                            for (let comp of result.address_components) {
                                if (comp.types && comp.types.includes('plus_code')) {
                                    plusCode = comp.long_name || comp.short_name || '';
                                    break;
                                }
                            }
                        }
                        if (plusCode) break;
                    }
                }
                selectedLocation = { lat, lng, address, plusCode: plusCode || '' };
                document.getElementById('picker-address-display').textContent = address || 'Address not found';
                document.getElementById('picker-pluscode-display').textContent = plusCode ? `Plus Code: ${plusCode}` : 'Plus Code: —';
            });
        }

        function searchAddressPicker() {
            const input = document.getElementById('picker-search');
            const query = input.value.trim();
            if (!query) return;
            const geocoder = new google.maps.Geocoder();
            geocoder.geocode({ address: query, region: 'ca' }, function(results, status) {
                if (status === 'OK' && results.length > 0) {
                    const location = results[0].geometry.location;
                    const lat = location.lat();
                    const lng = location.lng();
                    pickerMap.panTo({ lat, lng });
                    pickerMap.setZoom(14);
                    pickerMarker.setPosition({ lat, lng });
                    updatePickerInfo(lat, lng);
                } else {
                    alert('Location not found.');
                }
            });
        }

        function confirmAddress() {
            if (!selectedLocation) { alert("No location selected."); return; }
            let addressToUse = selectedLocation.address || selectedLocation.plusCode;
            if (!addressToUse) { alert("Could not determine address."); return; }
            document.getElementById('f-address').value = addressToUse;
            closeAddressPicker();
        }

        // ---------- ADDRESS AUTOCOMPLETE ----------
        function handleNameInput(val) {
            showSuggestions(val, 'suggestions', name => `<div class="suggestion-item" onclick="selectClient('${name.replace(/'/g, "\\'")}')">${name}</div>`);
        }
        function handleCityInput(val) {
            showSuggestions(val, 'city-suggestions', city => `<div class="suggestion-item" onclick="selectCity('${city.replace(/'/g, "\\'")}')">${city} (${addressData[city]?.city})</div>`);
        }
        function showSuggestions(val, elementId, htmlCallback) {
            const box = document.getElementById(elementId);
            if (val.length < 1) { box.style.display = 'none'; return; }
            const matches = Object.keys(addressData).filter(key => key.toLowerCase().startsWith(val.toLowerCase().trim()));
            if (matches.length === 0) { box.style.display = 'none'; return; }
            box.innerHTML = matches.map(htmlCallback).join('');
            box.style.display = 'block';
        }
        function selectClient(name) {
            const data = addressData[name];
            if (!data) return;
            document.getElementById('f-name').value = name;
            document.getElementById('f-address').value = data.address || '';
            document.getElementById('f-city').value = data.city || '';
            document.getElementById('suggestions').style.display = 'none';
        }
        function selectCity(city) {
            document.getElementById('f-city').value = city;
            document.getElementById('city-suggestions').style.display = 'none';
        }
        function resetFormFields() {
            document.getElementById('f-name').value = '';
            document.getElementById('f-address').value = '';
            document.getElementById('f-city').value = '';
        }

        function initPlaces() {
            const addressInput = document.getElementById('f-address');
            if (!addressInput) return;
            const options = {
                componentRestrictions: { country: 'ca' },
                bounds: new google.maps.Circle({ center: new google.maps.LatLng(49.848, -99.950), radius: 50000 }).getBounds(),
                strictBounds: false
            };
            autocompleteAddress = new google.maps.places.Autocomplete(addressInput, options);
            autocompleteAddress.addListener('place_changed', () => {
                const place = autocompleteAddress.getPlace();
                if (!place.address_components) return;
                for (let comp of place.address_components) {
                    if (comp.types.includes('locality')) {
                        document.getElementById('f-city').value = comp.long_name;
                        break;
                    }
                }
            });
        }

        // ---------- PWA INSTALL ----------
        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            document.getElementById('install-btn').style.display = 'block';
        });
        document.getElementById('install-btn').addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') deferredPrompt = null;
                document.getElementById('install-btn').style.display = 'none';
            }
        });
    </script>
</body>
